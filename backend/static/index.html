<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f766e" />
  <title>ППР ОСС / АПК — Satory UKG</title>
  <style>
    body{font-family:system-ui,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;background:#0f172a;color:#e2e8f0}
    .box{text-align:center}.spin{width:40px;height:40px;border:3px solid #334155;border-top-color:#14b8a6;border-radius:50%;animation:s .8s linear infinite;margin:0 auto 16px}
    @keyframes s{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div class="box"><div class="spin"></div><div>Загрузка системы ППР…</div></div>
  <script>
  (async function () {
    const urls = [
      "https://raw.githubusercontent.com/drycov/ppr-system/49c69516fc75afc313191ce0bf1ffb928310883a/backend/static/index.html",
      "https://cdn.jsdelivr.net/gh/drycov/ppr-system@49c69516fc75afc313191ce0bf1ffb928310883a/backend/static/index.html"
    ];
    let html = null, err = null;
    for (const url of urls) {
      try {
        const r = await fetch(url, { cache: "no-store" });
        if (!r.ok) throw new Error(url + " → " + r.status);
        html = await r.text();
        if (html.length < 10000) throw new Error("too short");
        break;
      } catch (e) { err = e; }
    }
    if (!html) {
      document.body.innerHTML = "<div class=box><p>Не удалось загрузить UI</p><pre>" + String(err) + "</pre></div>";
      return;
    }
    const patchTag = "<script src=\"/us-equipment-patch.js\"><\\/script>";
    if (html.indexOf("</body>") >= 0) html = html.replace("</body>", patchTag + "\n</body>");
    else html += patchTag;
    document.open();
    document.write(html);
    document.close();
  })();
  </script>
</body>
</html>
