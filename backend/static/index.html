<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f766e" />
  <title>ППР ОСС / АПК — Satory UKG</title>
  <style>
    body{font-family:system-ui,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;background:#0f172a;color:#e2e8f0}
    .box{text-align:center}.spin{width:40px;height:40px;border:3px solid #334155;border-top-color:#14b8a6;border-radius:50%;animation:s .8s linear infinite;margin:0 auto 16px}
    @keyframes s{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div class="box"><div class="spin"></div><div>Загрузка системы ППР…</div></div>
  <script>
  (async function () {
    const urls = [
      "https://raw.githubusercontent.com/drycov/ppr-system/49c69516fc75afc313191ce0bf1ffb928310883a/backend/static/index.html",
      "https://cdn.jsdelivr.net/gh/drycov/ppr-system@49c69516fc75afc313191ce0bf1ffb928310883a/backend/static/index.html"
    ];
    let html = null, err = null;
    for (const url of urls) {
      try {
        const r = await fetch(url, { cache: "no-store" });
        if (!r.ok) throw new Error(url + " → " + r.status);
        html = await r.text();
        if (html.length < 10000) throw new Error("too short");
        break;
      } catch (e) { err = e; }
    }
    if (!html) {
      document.body.innerHTML = "<div class=box><p>Не удалось загрузить UI</p><pre>" + String(err) + "</pre></div>";
      return;
    }

    // Bake US equipment fields into openObjectModal form source
    const oldForm = "          <div class=\"grid grid-cols-2 gap-3\">\n            <div>\n              <label class=\"block text-slate-600 mb-1\">Кол-во камер</label>\n              <input name=\"cameras_count\" type=\"number\" min=\"0\" value=\"${obj ? (obj.cameras_count||0) : 0}\" class=\"w-full border rounded-lg px-3 py-2\">\n            </div>\n            <div>\n              <label class=\"block text-slate-600 mb-1\">Статус</label>\n              <select name=\"status\" class=\"w-full border rounded-lg px-3 py-2\">\n                <option value=\"active\" ${status==='active'?'selected':''}>active</option>\n                <option value=\"relocated\" ${status==='relocated'?'selected':''}>relocated</option>\n                <option value=\"decommissioned\" ${status==='decommissioned'?'selected':''}>decommissioned</option>\n              </select>\n            </div>\n          </div>";

    const newForm = "          <div class=\"grid grid-cols-2 gap-3\">\n            <div>\n              <label class=\"block text-slate-600 mb-1\">Кол-во камер</label>\n              <input name=\"cameras_count\" type=\"number\" min=\"0\" value=\"${obj ? (obj.cameras_count||0) : 0}\" class=\"w-full border rounded-lg px-3 py-2\">\n            </div>\n            <div>\n              <label class=\"block text-slate-600 mb-1\">Статус</label>\n              <select name=\"status\" class=\"w-full border rounded-lg px-3 py-2\">\n                <option value=\"active\" ${status==='active'?'selected':''}>active</option>\n                <option value=\"relocated\" ${status==='relocated'?'selected':''}>relocated</option>\n                <option value=\"decommissioned\" ${status==='decommissioned'?'selected':''}>decommissioned</option>\n              </select>\n            </div>\n          </div>\n          <div id=\"obj-us-equipment\" class=\"${st==='us' ? '' : 'hidden'} rounded-xl border border-blue-100 bg-blue-50/50 p-3 space-y-3 mt-1\">\n            <div class=\"text-xs font-semibold uppercase tracking-wide text-blue-800\">Оборудование узла связи</div>\n            <div class=\"grid grid-cols-3 gap-3\">\n              <div>\n                <label class=\"block text-slate-600 mb-1 text-xs\">Коммутаторов</label>\n                <input name=\"switches_count\" type=\"number\" min=\"0\" value=\"${obj ? (obj.switches_count||0) : 0}\" class=\"w-full border rounded-lg px-3 py-2\">\n              </div>\n              <div>\n                <label class=\"block text-slate-600 mb-1 text-xs\">Роутеров</label>\n                <input name=\"routers_count\" type=\"number\" min=\"0\" value=\"${obj ? (obj.routers_count||0) : 0}\" class=\"w-full border rounded-lg px-3 py-2\">\n              </div>\n              <div>\n                <label class=\"block text-slate-600 mb-1 text-xs\">Дочерних объектов</label>\n                <input name=\"children_count\" type=\"number\" min=\"0\" value=\"${obj ? (obj.children_count||0) : 0}\" class=\"w-full border rounded-lg px-3 py-2\">\n              </div>\n            </div>\n          </div>";

    if (html.indexOf(oldForm) >= 0) {
      html = html.split(oldForm).join(newForm);
      console.info("[ppr] US equipment form injected");
    } else {
      console.warn("[ppr] form snippet not found for US equipment inject");
    }

    const oldSubmit = "cameras_count: parseInt(fd.get('cameras_count') || '0', 10) || 0,\n          status: fd.get('status'),";
    const newSubmit = "cameras_count: parseInt(fd.get('cameras_count') || '0', 10) || 0,\n          switches_count: parseInt(fd.get('switches_count') || '0', 10) || 0,\n          routers_count: parseInt(fd.get('routers_count') || '0', 10) || 0,\n          children_count: parseInt(fd.get('children_count') || '0', 10) || 0,\n          status: fd.get('status'),";
    if (html.indexOf(oldSubmit) >= 0) {
      html = html.split(oldSubmit).join(newSubmit);
    }

    const hook = "openModal();\n\n      if (isEdit) {";
    const hookNew = "openModal();\n\n      (function(){\n        var ts = document.querySelector('#object-form select[name=\"object_type\"]');\n        var ub = document.getElementById('obj-us-equipment');\n        function sync(){ if(ts&&ub) ub.classList.toggle('hidden', ts.value !== 'us'); }\n        if(ts){ ts.addEventListener('change', sync); sync(); }\n      })();\n\n      if (isEdit) {";
    if (html.indexOf(hook) >= 0) {
      html = html.split(hook).join(hookNew);
    }


    const zoneNavAnchor = "<a href=\"#\" data-page=\"directories\" class=\"sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-700 hover:bg-slate-50\">\n          <i data-lucide=\"library\" class=\"w-4 h-4\"></i> Справочники\n        </a>";
    const zoneNavNew = "<a href=\"#\" data-page=\"responsibility-zones\" class=\"sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-700 hover:bg-slate-50\">\n          <i data-lucide=\"users-round\" class=\"w-4 h-4\"></i> Зоны ответственности\n        </a>\n        <a href=\"#\" data-page=\"directories\" class=\"sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-700 hover:bg-slate-50\">\n          <i data-lucide=\"library\" class=\"w-4 h-4\"></i> Справочники\n        </a>";
    if (html.indexOf(zoneNavAnchor) >= 0) html = html.replace(zoneNavAnchor, zoneNavNew);

    const titleAnchor = "templates: 'Шаблоны работ'";
    if (html.indexOf(titleAnchor) >= 0) html = html.replace(titleAnchor, titleAnchor + ",\\n      'responsibility-zones': 'Зоны ответственности'");

    const pageAnchor = "else if (page === 'directories') await renderDirectories(content);";
    if (html.indexOf(pageAnchor) >= 0) html = html.replace(pageAnchor, "else if (page === 'responsibility-zones') await window.renderResponsibilityZones(content);\\n        " + pageAnchor);

    const responsibilityZonesScript = "<script>\n(function () {\n  function rzEsc(value) {\n    return String(value == null ? \"\" : value).replace(/[&<>\"']/g, function (c) {\n      return {\"&\":\"&amp;\",\"<\":\"&lt;\",\">\":\"&gt;\",'\"':\"&quot;\",\"'\":\"&#39;\"}[c];\n    });\n  }\n  window.renderResponsibilityZones = async function (el) {\n    if (!CURRENT_USER || CURRENT_USER.role !== \"admin\") {\n      el.innerHTML = '<div class=\"rounded-xl border border-amber-200 bg-amber-50 p-4 text-sm text-amber-800\">Управление зонами ответственности доступно администратору.</div>';\n      return;\n    }\n    var data = await Promise.all([\n      api(\"/api/departments?active_only=false\"),\n      api(\"/api/templates\"),\n      api(\"/api/staff?active_only=true\"),\n      api(\"/api/objects?status=active&limit=500\"),\n      api(\"/api/object-types\"),\n      api(\"/api/responsibility-zones\")\n    ]);\n    var departments=data[0], templates=data[1], staff=data[2], objects=data[3], types=data[4], zones=data[5];\n    var editing = null;\n    function draw(editZone) {\n      editing = editZone || null;\n      var zone = editing || {};\n      var departmentOptions = departments.map(function(d){return '<option value=\"'+d.id+'\" '+(Number(zone.department_id)===Number(d.id)?'selected':'')+'>'+rzEsc(d.name)+(d.is_active===false?' (неактивно)':'')+'</option>';}).join(\"\");\n      var templateOptions = templates.map(function(t){return '<option value=\"'+t.id+'\" '+(Number(zone.template_id)===Number(t.id)?'selected':'')+'>'+rzEsc(t.code)+' — '+rzEsc(t.name)+'</option>';}).join(\"\");\n      var staffOptions = staff.filter(function(u){return u.is_active!==false && u.can_do_ppr!==false;}).map(function(u){return '<option value=\"'+u.id+'\" '+(Number(zone.assignee_id)===Number(u.id)?'selected':'')+'>'+rzEsc(u.full_name||u.username)+' · '+rzEsc(departments.find(function(d){return Number(d.id)===Number(u.department_id);})?.name||'без подразделения')+'</option>';}).join(\"\");\n      var typeOptions = types.map(function(t){return '<option value=\"'+rzEsc(t.code)+'\" '+((zone.object_types||[]).includes(t.code)?'selected':'')+'>'+rzEsc(t.name)+'</option>';}).join(\"\");\n      var objectOptions = objects.map(function(o){return '<option value=\"'+o.id+'\" '+((zone.object_ids||[]).map(Number).includes(Number(o.id))?'selected':'')+'>'+rzEsc(o.code)+' — '+rzEsc(o.name||'без названия')+' ('+rzEsc(o.object_type)+')</option>';}).join(\"\");\n      var rows = zones.map(function(z){\n        var d=departments.find(function(x){return Number(x.id)===Number(z.department_id);});\n        var t=templates.find(function(x){return Number(x.id)===Number(z.template_id);});\n        var u=staff.find(function(x){return Number(x.id)===Number(z.assignee_id);});\n        var scope=(z.object_ids||[]).length ? 'Объекты: '+(z.object_ids||[]).map(function(id){var o=objects.find(function(x){return Number(x.id)===Number(id);});return o?o.code:'#'+id;}).join(', ') : ((z.object_types||[]).length ? 'Типы: '+(z.object_types||[]).map(function(code){var x=types.find(function(y){return y.code===code;});return x?x.name:code;}).join(', ') : 'Весь регламент');\n        return '<article class=\"rounded-xl border border-slate-200 bg-white p-4\"><div class=\"flex flex-col gap-3 sm:flex-row sm:items-start sm:justify-between\"><div class=\"min-w-0\"><div class=\"font-semibold text-slate-900\">'+rzEsc(z.name)+'</div><div class=\"mt-1 text-sm text-slate-600\">'+rzEsc(d?d.name:'Подразделение #'+z.department_id)+' · '+rzEsc(t?t.code+' — '+t.name:'Регламент #'+z.template_id)+'</div><div class=\"mt-1 text-sm text-slate-600\">Исполнитель: '+rzEsc(u?(u.full_name||u.username):'не назначен')+'</div><div class=\"mt-1 text-xs text-slate-500\">'+rzEsc(scope)+'</div>'+(z.notes?'<div class=\"mt-2 text-sm text-slate-500\">'+rzEsc(z.notes)+'</div>':'')+'<div class=\"mt-2 text-xs '+(z.is_active?'text-emerald-700':'text-slate-500')+'\">'+(z.is_active?'Активна':'Отключена')+'</div></div><div class=\"flex shrink-0 gap-2\"><button type=\"button\" data-rz-edit=\"'+z.id+'\" class=\"rounded-lg border border-slate-200 px-3 py-2 text-sm hover:bg-slate-50\">Изменить</button><button type=\"button\" data-rz-delete=\"'+z.id+'\" class=\"rounded-lg border border-rose-200 px-3 py-2 text-sm text-rose-700 hover:bg-rose-50\">Удалить</button></div></div></article>';\n      }).join(\"\");\n      el.innerHTML = '<div class=\"space-y-5\"><section class=\"rounded-2xl border border-slate-200 bg-white p-5\"><div class=\"mb-4\"><h2 class=\"text-xl font-semibold text-slate-900\">Зоны ответственности</h2><p class=\"mt-1 text-sm text-slate-500\">Назначение сотрудников по подразделению и регламенту. Для каждого регламента можно задать общую зону, типы объектов или отдельные объекты. Привязка объектов к подразделениям не создаётся.</p></div><form id=\"rz-form\" class=\"space-y-4\"><div class=\"grid gap-3 md:grid-cols-2 xl:grid-cols-3\"><label class=\"block text-sm\"><span class=\"mb-1 block font-medium text-slate-700\">Название зоны</span><input name=\"name\" required maxlength=\"150\" value=\"'+rzEsc(zone.name||'')+'\" placeholder=\"Серверная / физическая кабельная / сеть\" class=\"w-full rounded-lg border border-slate-200 px-3 py-2.5\"></label><label class=\"block text-sm\"><span class=\"mb-1 block font-medium text-slate-700\">Подразделение</span><select name=\"department_id\" required class=\"w-full rounded-lg border border-slate-200 px-3 py-2.5\">'+departmentOptions+'</select></label><label class=\"block text-sm\"><span class=\"mb-1 block font-medium text-slate-700\">Регламент</span><select name=\"template_id\" required class=\"w-full rounded-lg border border-slate-200 px-3 py-2.5\"><option value=\"\">Выберите регламент</option>'+templateOptions+'</select></label><label class=\"block text-sm md:col-span-2\"><span class=\"mb-1 block font-medium text-slate-700\">Ответственный сотрудник</span><select name=\"assignee_id\" class=\"w-full rounded-lg border border-slate-200 px-3 py-2.5\"><option value=\"\">Не назначен (использовать стандартное распределение)</option>'+staffOptions+'</select><span class=\"mt-1 block text-xs text-slate-500\">Доступны активные сотрудники подразделения с правом выполнять ППР.</span></label><label class=\"block text-sm\"><span class=\"mb-1 block font-medium text-slate-700\">Типы объектов (необязательно)</span><select name=\"object_types\" multiple size=\"4\" class=\"w-full rounded-lg border border-slate-200 px-3 py-2.5\">'+typeOptions+'</select><span class=\"mt-1 block text-xs text-slate-500\">Выберите типы или конкретные объекты ниже.</span></label><label class=\"block text-sm md:col-span-2\"><span class=\"mb-1 block font-medium text-slate-700\">Конкретные объекты (необязательно)</span><select name=\"object_ids\" multiple size=\"4\" class=\"w-full rounded-lg border border-slate-200 px-3 py-2.5\">'+objectOptions+'</select></label><label class=\"block text-sm md:col-span-2\"><span class=\"mb-1 block font-medium text-slate-700\">Примечание</span><textarea name=\"notes\" rows=\"2\" class=\"w-full rounded-lg border border-slate-200 px-3 py-2.5\">'+rzEsc(zone.notes||'')+'</textarea></label><label class=\"flex items-center gap-2 text-sm\"><input name=\"is_active\" type=\"checkbox\" '+(zone.is_active===false?'':'checked')+' class=\"rounded border-slate-300\"><span>Зона активна</span></label></div><div id=\"rz-status\" class=\"hidden rounded-lg p-3 text-sm\"></div><div class=\"flex flex-wrap gap-2\"><button type=\"submit\" class=\"rounded-lg bg-teal-700 px-4 py-2.5 text-sm font-medium text-white hover:bg-teal-800\">'+(editing?'Сохранить изменения':'Добавить зону')+'</button>'+(editing?'<button type=\"button\" id=\"rz-cancel\" class=\"rounded-lg border border-slate-200 px-4 py-2.5 text-sm\">Отмена редактирования</button>':'')+'</div></form></section><section class=\"space-y-3\"><div class=\"flex flex-wrap items-center justify-between gap-2\"><h3 class=\"text-lg font-semibold text-slate-900\">Настроенные зоны ('+zones.length+')</h3><button type=\"button\" id=\"rz-refresh\" class=\"rounded-lg border border-slate-200 px-3 py-2 text-sm\">Обновить</button></div>'+(rows||'<div class=\"rounded-xl border border-dashed border-slate-300 p-8 text-center text-sm text-slate-500\">Зоны ответственности ещё не настроены.</div>')+'</section></div>';\n      var form=el.querySelector(\"#rz-form\");\n      var typeSelect=form.elements.object_types, objectSelect=form.elements.object_ids;\n      typeSelect.addEventListener(\"change\",function(){if(Array.from(typeSelect.selectedOptions).length) Array.from(objectSelect.options).forEach(function(o){o.selected=false;});});\n      objectSelect.addEventListener(\"change\",function(){if(Array.from(objectSelect.selectedOptions).length) Array.from(typeSelect.options).forEach(function(o){o.selected=false;});});\n      var status=el.querySelector(\"#rz-status\");\n      function showStatus(message,ok){status.textContent=message;status.className=\"rounded-lg p-3 text-sm \"+(ok?\"bg-emerald-50 text-emerald-800\":\"bg-rose-50 text-rose-700\");}\n      form.addEventListener(\"submit\",async function(event){\n        event.preventDefault();\n        var payload={\n          name:form.elements.name.value.trim(),\n          department_id:Number(form.elements.department_id.value),\n          template_id:Number(form.elements.template_id.value),\n          assignee_id:form.elements.assignee_id.value?Number(form.elements.assignee_id.value):null,\n          object_types:Array.from(typeSelect.selectedOptions).map(function(o){return o.value;}),\n          object_ids:Array.from(objectSelect.selectedOptions).map(function(o){return Number(o.value);}),\n          is_active:form.elements.is_active.checked,\n          notes:form.elements.notes.value.trim()||null\n        };\n        if(payload.object_types.length&&payload.object_ids.length){showStatus(\"Выберите типы объектов или конкретные объекты, не оба варианта.\",false);return;}\n        try {\n          await api(editing?\"/api/responsibility-zones/\"+editing.id:\"/api/responsibility-zones\",{method:editing?\"PATCH\":\"POST\",body:JSON.stringify(payload)});\n          window.renderResponsibilityZones(el);\n        } catch(error) {showStatus(error.message||\"Не удалось сохранить зону.\",false);}\n      });\n      var cancel=el.querySelector(\"#rz-cancel\");\n      if(cancel) cancel.addEventListener(\"click\",function(){draw(null);});\n      var refresh=el.querySelector(\"#rz-refresh\");\n      if(refresh) refresh.addEventListener(\"click\",function(){window.renderResponsibilityZones(el);});\n      el.querySelectorAll(\"[data-rz-edit]\").forEach(function(button){button.addEventListener(\"click\",function(){var item=zones.find(function(z){return Number(z.id)===Number(button.dataset.rzEdit);});if(item)draw(item);});});\n      el.querySelectorAll(\"[data-rz-delete]\").forEach(function(button){button.addEventListener(\"click\",async function(){if(!confirm(\"Удалить зону ответственности?\"))return;try{await api(\"/api/responsibility-zones/\"+button.dataset.rzDelete,{method:\"DELETE\"});window.renderResponsibilityZones(el);}catch(error){showStatus(error.message||\"Не удалось удалить зону.\",false);}});});\n    }\n    draw(null);\n  };\n  var nav=document.querySelector('[data-page=\"responsibility-zones\"]');\n  if(nav && (!CURRENT_USER || CURRENT_USER.role!==\"admin\")) nav.classList.add(\"hidden\");\n})();\n</script>";
    if (html.indexOf('</body>') >= 0) html = html.replace('</body>', responsibilityZonesScript + '</body>');

    document.open();
    document.write(html);
    document.close();
  })();
  </script>
</body>
</html>
