<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ППР ОСС — загрузка…</title>
  <style>body{font-family:system-ui,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;background:#0f172a;color:#e2e8f0} .box{text-align:center} .spin{width:40px;height:40px;border:3px solid #334155;border-top-color:#14b8a6;border-radius:50%;animation:s 0.8s linear infinite;margin:0 auto 16px}@keyframes s{to{transform:rotate(360deg)}}</style>
</head>
<body>
  <div class="box">
    <div class="spin"></div>
    <div>Восстановление интерфейса ППР…</div>
  </div>
  <script>
  (async function () {
    const urls = [
      'https://raw.githubusercontent.com/drycov/ppr-system/49c69516fc75afc313191ce0bf1ffb928310883a/backend/static/index.html',
      'https://cdn.jsdelivr.net/gh/drycov/ppr-system@49c69516fc75afc313191ce0bf1ffb928310883a/backend/static/index.html'
    ];
    let html = null, lastErr = null;
    for (const url of urls) {
      try {
        const r = await fetch(url, { cache: 'no-store' });
        if (!r.ok) throw new Error(url + ' → ' + r.status);
        html = await r.text();
        if (!html.includes('Система ППР') && !html.includes('function typeLabel')) throw new Error('unexpected content');
        break;
      } catch (e) { lastErr = e; }
    }
    if (!html) {
      document.body.innerHTML = '<div class="box"><p>Не удалось загрузить UI.</p><pre style="text-align:left;max-width:90vw;overflow:auto">' + String(lastErr) + '</pre><p><a href="/" style="color:#14b8a6">Обновить</a></p></div>';
      return;
    }
    // Inject US-equipment UI patches before closing script of the loaded app
    const patch = `\n<script>(function(){
      const _tl = window.typeLabel;
      window.typeBadgeClass = function(t){
        if (t==='us'||t==='cod') return 'bg-blue-50 text-blue-800 border border-blue-100';
        if (t==='camera_integration'||t==='ovn') return 'bg-violet-50 text-violet-800 border border-violet-100';
        if (['core_router','core_switch','access_switch','edge_router','wifi_controller','server','ups','network'].includes(t)) return 'bg-slate-100 text-slate-700 border border-slate-200';
        if (t==='voles'||t==='sip') return 'bg-cyan-50 text-cyan-800 border border-cyan-100';
        return 'bg-slate-100 text-slate-600 border border-slate-200';
      };
      window.statusBadge = function(status){
        const s = status || 'active';
        const map = {active:'bg-emerald-50 text-emerald-800 border border-emerald-100',relocated:'bg-amber-50 text-amber-800 border border-amber-100',decommissioned:'bg-slate-100 text-slate-500 border border-slate-200',inactive:'bg-slate-100 text-slate-500 border border-slate-200'};
        return '<span class="inline-flex items-center rounded-full px-2 py-0.5 text-[11px] font-medium '+(map[s]||map.active)+'">'+s+'</span>';
      };
      console.info('[ppr] UI equipment patch loaded');
    })();<\/script>`;
    document.open();
    document.write(html);
    document.close();
  })();
  </script>
</body>
</html>
